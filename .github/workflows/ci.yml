name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      # -coverpkg counts every package's statements, so a new package with
      # no tests drags the gate down instead of silently missing the profile.
      # HERALD_MAIN_COVERDIR makes each main() guard test persist its
      # subprocess GOCOVERDIR dump for the merge step below.
      - name: Run tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...
        env:
          HERALD_MAIN_COVERDIR: build/maincover

      # main() is only reachable by launching a process: the guard tests run
      # every entry point as a real child under `go build -cover` + GOCOVERDIR.
      # covermerge folds those measured counts into the gate profile and
      # hard-fails when a dump is empty, absent, never reached its main.go
      # (basename-checked), or contains blocks unknown to the main profile.
      - name: Merge main() subprocess coverage
        run: |
          python3 tools/covermerge.py coverage.out build/maincover/*.cov \
            --expect github.com/cuihairu/herald/cmd/heraldd/main.go \
            --expect github.com/cuihairu/herald/examples/quickstart/main.go \
            --expect github.com/cuihairu/herald/worker-sdk/go/example/main.go \
            -o coverage.merged.out

      # Coverage gate: 100% of statements on the merged profile, with only the
      # blocks registered in KNOWN_UNCOVERABLE.md (os.Exit lines the Go
      # toolchain cannot measure) excluded from the computation. zero_check
      # also fails on any zero block that is neither registered nor annotated
      # in place.
      - name: Enforce coverage gate
        run: |
          python3 tools/zero_check.py coverage.merged.out --gate 100
          total=$(go tool cover -func=coverage.merged.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          echo "merged statement coverage: ${total}%"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.merged.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest coverage thresholds enforce 100% line coverage in
      # vitest.config.ts — the frontend gate mirrors the Go one.
      - name: Run tests with coverage
        run: pnpm test:coverage

      # tsc -b type-checks the test files too, then vite bundles.
      - name: Build
        run: pnpm build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          go build -v -o bin/heraldd ./cmd/heraldd
          go build -v -o bin/worker-example ./worker-sdk/go/example

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/*

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: herald:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
