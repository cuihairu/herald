name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      # -coverpkg counts every package's statements, so a new package with
      # no tests drags the gate down instead of silently missing the profile.
      - name: Run tests
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...

      # Coverage gate: the measured high-water mark. Every uncovered
      # statement block is an unreachable/defensive branch documented in
      # place — see docs/architecture/coverage.md.
      - name: Enforce coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $NF); print $NF}')
          echo "statement coverage: ${total}%"
          if ! awk -v t="$total" 'BEGIN { exit !(t+0 >= 99.5) }'; then
            echo "::error::coverage ${total}% is below the 99.5% gate"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          go build -v -o bin/heraldd ./cmd/heraldd
          go build -v -o bin/worker-example ./worker-sdk/go/example

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/*

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: herald:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
