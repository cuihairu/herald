name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        working-directory: ./docs
        run: pnpm install --frozen-lockfile

      # The OpenAPI spec is the SDK source of truth for integrators; a YAML or
      # $ref breakage must fail CI, not ship silently to docs pages.
      - name: Validate OpenAPI spec
        working-directory: ./docs
        run: |
          python3 - <<'PY'
          import sys, yaml
          spec = yaml.safe_load(open('api/openapi.yaml'))
          assert spec['openapi'].startswith('3.'), 'openapi must be 3.x'
          ops = 0
          for path in spec.get('paths', {}).values():
              ops += sum(1 for k in path if k in ('get', 'post', 'put', 'delete', 'patch'))
          refs = []
          def walk(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == '$ref':
                          refs.append(v)
                      else:
                          walk(v)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)
          walk(spec)
          for ref in refs:
              assert ref.startswith('#/'), f'external ref not allowed: {ref}'
              target = spec
              for part in ref[2:].split('/'):
                  part = part.replace('~1', '/').replace('~0', '~')
                  target = target[part]
          print(f"openapi {spec['openapi']}: {len(spec.get('paths', {}))} paths, {ops} ops, {len(refs)} refs resolved")
          PY

      - name: Build
        working-directory: ./docs
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: docs/.vitepress/dist/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: docs-build
          path: ./dist
          digest-mismatch: warn

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
