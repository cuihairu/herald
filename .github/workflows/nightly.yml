# Rolling nightly builds. This is NOT a formal release channel: no version
# tag is created, and assets publish to the single rolling `nightly`
# prerelease ONLY after the repo's own gate (full test suite + coverage gate)
# passes. Scheduled runs skip entirely when main has no commit in the last
# 48 hours; workflow_dispatch always builds. No versioned release is issued
# here — versions are cut manually by the maintainer only. Asset names carry
# no version (rolling, newest-wins); the version inside each .ipk tracks
# `git describe --tags --always`.
name: Nightly build
on:
  schedule:
    # 04:23 Asia/Shanghai; use an off-minute to reduce scheduler contention.
    - cron: '23 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  # Test gate, CI-同口径 (same steps as the ci.yml test job), plus the 48h
  # freshness gate (fleet pattern): a scheduled wake with no new commit on
  # origin/main skips everything downstream; manual dispatch always builds.
  # The packaging scripts get syntax/lint gates here too so a broken shell
  # or Lua file fails the run before any binary is built.
  gate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: 48h freshness gate (scheduled runs only)
        id: fresh
        run: |
          fresh=true
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ -z "$(git log -1 --since='48 hours ago' --format=%H origin/main)" ]; then
            fresh=false
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "fresh: $fresh"
      - name: Set up Go
        if: steps.fresh.outputs.fresh == 'true'
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Packaging script gates
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          if ! command -v luac5.1 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y lua5.1
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          sh -n packaging/openwrt/build-ipk.sh
          sh -n packaging/openwrt/etc/init.d/herald
          sh -n packaging/openwrt/CONTROL/postinst
          sh -n packaging/openwrt/CONTROL/prerm
          shellcheck -s sh packaging/openwrt/build-ipk.sh
          luac5.1 -p packaging/openwrt/usr/lib/lua/luci/controller/herald.lua \
            packaging/openwrt/usr/lib/lua/luci/model/cbi/herald.lua
      - name: Download dependencies
        if: steps.fresh.outputs.fresh == 'true'
        run: go mod download
      # Same command surface as ci.yml: -coverpkg counts every package's
      # statements; HERALD_MAIN_COVERDIR persists each main() guard test's
      # subprocess dump for the merge step.
      - name: Run tests
        if: steps.fresh.outputs.fresh == 'true'
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.out ./...
        env:
          HERALD_MAIN_COVERDIR: ${{ github.workspace }}/build/maincover
      - name: Merge main() subprocess coverage
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          ls build/maincover/
          python3 tools/covermerge.py coverage.out build/maincover/*.cov \
            --expect github.com/cuihairu/herald/cmd/heraldd/main.go \
            --expect github.com/cuihairu/herald/examples/quickstart/main.go \
            --expect github.com/cuihairu/herald/apps-sdk/go/example/main.go \
            --expect github.com/cuihairu/herald/worker-sdk/go/example/main.go \
            -o coverage.merged.out
      - name: Enforce coverage gate
        if: steps.fresh.outputs.fresh == 'true'
        run: python3 tools/zero_check.py coverage.merged.out --gate 100
  # Cross-compiled static heraldd per architecture (CGO_ENABLED=0: the
  # sqlite dependency is modernc.org/sqlite, pure Go) wrapped into the
  # three-part .ipk set. luci-app and app-meta are arch=all, so both matrix
  # legs build them; the publish job uploads with --clobber, so the
  # duplicate is harmless.
  build:
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            goarch: amd64
            arch: x86_64
          - runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            goarch: arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Full history so `git describe --tags` resolves the nearest tag
          # for the package version.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Cross-compile heraldd
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" \
            -o "bin/heraldd-${{ matrix.arch }}" ./cmd/heraldd
          file "bin/heraldd-${{ matrix.arch }}"
      - name: Build OpenWrt ipk packages
        run: |
          mkdir -p bin/ipk-${{ matrix.arch }} dist
          mv "bin/heraldd-${{ matrix.arch }}" "bin/ipk-${{ matrix.arch }}/heraldd"
          version=$(git describe --tags --always)
          packaging/openwrt/build-ipk.sh "bin/ipk-${{ matrix.arch }}" dist \
            --arch ${{ matrix.arch }} --version "$version"
          # Rolling asset names: no version in the filename, newest-wins.
          # Glob instead of exact names: build-ipk.sh sanitizes the version
          # string (strips a leading "v"), so the shell variable and the
          # output filename would disagree.
          mv dist/herald_*_${{ matrix.arch }}.ipk \
            dist/herald-nightly-openwrt-${{ matrix.arch }}.ipk
          mv dist/luci-app-herald_*_all.ipk \
            dist/herald-nightly-openwrt-luci-app.ipk
          mv dist/app-meta-herald_*_all.ipk \
            dist/herald-nightly-openwrt-app-meta.ipk
          ls -l dist/
      # Generic Linux tarball alongside the ipk set: flat layout
      # (heraldd config.yaml LICENSE README.md), rolling asset name.
      - name: Package Linux binary tarball
        run: |
          mkdir -p dist/linux
          cp "bin/ipk-${{ matrix.arch }}/heraldd" dist/linux/heraldd
          # Shared default config: the OpenWrt advanced-mode file is the
          # same runnable-but-inert config (loopback, auth off, log only).
          cp packaging/openwrt/etc/herald/config.yaml dist/linux/config.yaml
          cp LICENSE README.md dist/linux/
          tar czf "dist/herald-nightly-linux-${{ matrix.arch }}.tar.gz" \
            -C dist/linux heraldd config.yaml LICENSE README.md
      - name: Smoke test Linux binary
        run: |
          mkdir -p dist/linux-smoke
          tar xzf "dist/herald-nightly-linux-${{ matrix.arch }}.tar.gz" -C dist/linux-smoke
          cd dist/linux-smoke
          # qemu first: on arm64 even the usage surface must run under
          # emulation (aarch64 binary on an x86_64 runner).
          qemu=""
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static >/dev/null
            qemu="qemu-aarch64-static"
          fi
          # Usage surface: no args prints usage and exits 1 (expected).
          out=$($qemu ./heraldd 2>&1 || true)
          case "$out" in
            *"Usage: heraldd"*) ;;
            *) echo "$out"; exit 1 ;;
          esac
          # Live serve smoke on a cold port pair. arm64 runs under
          # qemu-user (the binary is fully static, pure Go).
          cat > smoke-config.yaml <<'YAML'
          server:
            addr: "127.0.0.1:18793"
          store_path: "./smoke-store.db"
          auth:
            enabled: false
          providers:
            log:
              type: log
              enabled: true
              config:
                name: "herald"
          routes:
            error:
              - log
            warning:
              - log
            info:
              - log
          queue:
            type: memory
          websocket:
            addr: "127.0.0.1:18794"
          YAML
          $qemu ./heraldd serve -c smoke-config.yaml > serve.log 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:18793/api/v1/status | grep -q '"status":"running"'; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill $pid 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "liveness smoke failed (${{ matrix.arch }})"
            cat serve.log
            exit 1
          fi
          echo "serve smoke ok (${{ matrix.arch }})"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-openwrt-${{ matrix.arch }}
          path: dist/*
  # Windows native build on a Windows runner: smoke tests run the real exe
  # (usage surface, then live serve + liveness endpoint), not just a PE
  # header check.
  build-windows:
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build heraldd.exe
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w" -o bin/heraldd.exe ./cmd/heraldd
      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/heraldd.exe dist/
          Copy-Item packaging/openwrt/etc/herald/config.yaml dist/config.yaml
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/heraldd.exe, dist/config.yaml, dist/LICENSE, dist/README.md `
            -DestinationPath dist/herald-nightly-windows-x86_64.zip -Force
          Remove-Item dist/heraldd.exe, dist/config.yaml, dist/LICENSE, dist/README.md
      - name: Smoke test heraldd.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/herald-nightly-windows-x86_64.zip -DestinationPath smoke
          Set-Location smoke
          $out = (& .\heraldd.exe 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 1 -or -not $out.Contains('Usage: heraldd')) {
            Write-Host $out
            exit 1
          }
          $cfg = @'
          server:
            addr: "127.0.0.1:18793"
          store_path: "./smoke-store.db"
          auth:
            enabled: false
          providers:
            log:
              type: log
              enabled: true
              config:
                name: "herald"
          routes:
            error:
              - log
            warning:
              - log
            info:
              - log
          queue:
            type: memory
          websocket:
            addr: "127.0.0.1:18794"
          '@
          Set-Content -Path smoke-config.yaml -Value $cfg -Encoding utf8NoBOM
          $p = Start-Process -FilePath .\heraldd.exe `
            -ArgumentList 'serve','-c','smoke-config.yaml' `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput serve.log -RedirectStandardError serve-err.log
          $ok = $false
          foreach ($i in 1..40) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:18793/api/v1/status -TimeoutSec 2
              if ($r.Content -like '*"status":"running"*') { $ok = $true; break }
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Get-Content serve.log
            Get-Content serve-err.log
            exit 1
          }
          Write-Host 'serve smoke ok (windows x86_64)'
          # The runner appends `exit $LASTEXITCODE` to pwsh steps; the
          # usage-surface check above leaves $LASTEXITCODE at 1 (expected
          # heraldd behavior), so close the success path explicitly.
          exit 0
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-windows-x86_64
          path: dist/*
  # macOS build on an arm64 runner; x86_64 is cross-compiled and smoked
  # under Rosetta 2 (installed first — not part of the runner image).
  build-macos:
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build and package macOS tarballs
        run: |
          mkdir -p dist
          # Asset names use the Apple arch terms (arm64 / x86_64); the Go
          # GOARCH name for x86_64 is amd64.
          for arch in arm64 x86_64; do
            goarch=$([ "$arch" = arm64 ] && echo arm64 || echo amd64)
            mkdir -p "pkg-$arch"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$goarch \
              go build -trimpath -ldflags "-s -w" -o "pkg-$arch/heraldd" ./cmd/heraldd
            file "pkg-$arch/heraldd"
            cp packaging/openwrt/etc/herald/config.yaml "pkg-$arch/config.yaml"
            cp LICENSE README.md "pkg-$arch/"
            tar czf "dist/herald-nightly-macos-$arch.tar.gz" \
              -C "pkg-$arch" heraldd config.yaml LICENSE README.md
          done
          ls -l dist/
      - name: Smoke test macOS binaries
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          for arch in arm64 x86_64; do
            mkdir -p "smoke-$arch"
            tar xzf "dist/herald-nightly-macos-$arch.tar.gz" -C "smoke-$arch"
            cd "smoke-$arch"
            out=$(./heraldd 2>&1 || true)
            case "$out" in
              *"Usage: heraldd"*) ;;
              *) echo "$out"; exit 1 ;;
            esac
            # printf instead of a heredoc: inside the for loop every line
            # carries indentation, and a heredoc terminator must be
            # flush-left, which a YAML block scalar cannot provide.
            printf '%s\n' \
              'server:' \
              '  addr: "127.0.0.1:18793"' \
              'store_path: "./smoke-store.db"' \
              'auth:' \
              '  enabled: false' \
              'providers:' \
              '  log:' \
              '    type: log' \
              '    enabled: true' \
              '    config:' \
              '      name: "herald"' \
              'routes:' \
              '  error:' \
              '    - log' \
              '  warning:' \
              '    - log' \
              '  info:' \
              '    - log' \
              'queue:' \
              '  type: memory' \
              'websocket:' \
              '  addr: "127.0.0.1:18794"' \
              > smoke-config.yaml
            ./heraldd serve -c smoke-config.yaml > serve.log 2>&1 &
            pid=$!
            ok=""
            for _ in $(seq 1 40); do
              if curl -sf http://127.0.0.1:18793/api/v1/status | grep -q '"status":"running"'; then
                ok=1
                break
              fi
              sleep 0.5
            done
            kill $pid 2>/dev/null || true
            if [ -z "$ok" ]; then
              echo "liveness smoke failed (macos $arch)"
              cat serve.log
              exit 1
            fi
            echo "serve smoke ok (macos $arch)"
            cd ..
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nightly-macos
          path: dist/*
  publish:
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.fresh == 'true'
    needs: [gate, build, build-windows, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          # A single glob: download-artifact does not split a multi-line
          # pattern, so match every nightly artifact prefix with one pattern.
          pattern: nightly-*
          merge-multiple: true
          path: dist/
      - name: Publish rolling nightly release (single release)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum herald-nightly-* > SHA256SUMS
          cat > notes.md <<NOTES
          Automated nightly prerelease from commit ${GITHUB_SHA}.
          Contents: OpenWrt .ipk packages for routers/iStoreOS
          (herald-nightly-openwrt-<arch>.ipk with the luci-app and iStore
          metadata companions; x86_64 / aarch64, static binaries) plus
          native heraldd binaries for generic hosts: herald-nightly-linux-
          <arch>.tar.gz (x86_64 / aarch64), herald-nightly-windows-x86_64
          .zip and herald-nightly-macos-<arch>.tar.gz (arm64 / x86_64).
          Each archive carries heraldd plus a runnable-but-inert
          config.yaml (loopback bind, auth off, log provider only — fill
          credentials yourself), the LICENSE and the README. Usage:
          unpack, then run heraldd serve --config config.yaml. Binaries
          were smoke-tested on their target platform (usage surface plus a
          live serve and liveness endpoint; linux arm64 under qemu-user,
          macOS x86_64 under Rosetta 2). The herald package ships with all
          credentials empty — configure via LuCI, /etc/herald/config.yaml
          or the bundled config.yaml. SHA256SUMS verifies the downloaded
          assets. Every asset was built only after the full test suite and
          the coverage gate passed.
          This is NOT a stable release: nightly is a rolling build-artifact
          channel. Versioned releases are issued manually by the maintainer
          only. The nightly tag tracks the most recent successful build.
          NOTES
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release upload nightly herald-nightly-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title 'Nightly' --notes-file notes.md
          else
            gh release create nightly herald-nightly-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Nightly' --notes-file notes.md
          fi
