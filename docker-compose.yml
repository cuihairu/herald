version: '3.8'

services:
  # 调度器（API + Queue + local workers）
  herald:
    build:
      context: .
      dockerfile: Dockerfile
    image: herald:latest
    container_name: herald
    command: serve --config /app/config.yaml
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    # 与 .env.example 一一对应的透传清单（${VAR:-} 未设时传空，不刷警告）。
    # config.yaml 里的 $VAR 只在变量有值时替换，空值保留字面量，enabled=false
    # 的渠道不受影响；启用某渠道前先在 .env 里填好对应变量。
    environment:
      - HERALD_JWT_SECRET=${HERALD_JWT_SECRET:-}
      - HERALD_ADMIN_PASSWORD=${HERALD_ADMIN_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL:-}
      - DINGTALK_ACCESS_TOKEN=${DINGTALK_ACCESS_TOKEN:-}
      - DINGTALK_SECRET=${DINGTALK_SECRET:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - EMAIL_USERNAME=${EMAIL_USERNAME:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-}
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID:-}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY:-}
      - TENCENT_SMS_APP_ID=${TENCENT_SMS_APP_ID:-}
      - NETEASE_APP_KEY=${NETEASE_APP_KEY:-}
      - NETEASE_APP_SECRET=${NETEASE_APP_SECRET:-}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_CLIENT_EMAIL=${FCM_CLIENT_EMAIL:-}
      - FCM_PRIVATE_KEY=${FCM_PRIVATE_KEY:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_PRIVATE_KEY=${APNS_PRIVATE_KEY:-}
      - APNS_CERT_PEM=${APNS_CERT_PEM:-}
      - APNS_TOPIC=${APNS_TOPIC:-}
      - JPUSH_APP_KEY=${JPUSH_APP_KEY:-}
      - JPUSH_MASTER_SECRET=${JPUSH_MASTER_SECRET:-}
      - GETUI_APP_ID=${GETUI_APP_ID:-}
      - GETUI_APP_KEY=${GETUI_APP_KEY:-}
      - GETUI_MASTER_SECRET=${GETUI_MASTER_SECRET:-}
      - WECHAT_SERVERCHAN_SEND_KEY=${WECHAT_SERVERCHAN_SEND_KEY:-}
      - WECHAT_PUSHPLUS_TOKEN=${WECHAT_PUSHPLUS_TOKEN:-}
      - WECHAT_WXPUSHER_APP_TOKEN=${WECHAT_WXPUSHER_APP_TOKEN:-}
      - WECHAT_WXPUSHER_UID=${WECHAT_WXPUSHER_UID:-}
      - WECHATMP_APP_ID=${WECHATMP_APP_ID:-}
      - WECHATMP_APP_SECRET=${WECHATMP_APP_SECRET:-}
      - WECHATMP_TEMPLATE_ID=${WECHATMP_TEMPLATE_ID:-}
      - WECHATMP_DEFAULT_URL=${WECHATMP_DEFAULT_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 远程 Worker 示例（取消注释启用）
  # 使用 Redis 队列时，Worker 可独立部署
  #
  # herald-worker:
  #   image: herald:latest
  #   container_name: herald-worker
  #   command: worker --config /app/worker.yaml
  #   volumes:
  #     - ./worker.yaml:/app/worker.yaml:ro
  #   depends_on:
  #     - redis
  #   restart: unless-stopped

  # Redis（分布式部署时启用，队列后端）
  # redis:
  #   image: redis:7-alpine
  #   container_name: herald-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped

networks:
  default:
    name: herald-network

