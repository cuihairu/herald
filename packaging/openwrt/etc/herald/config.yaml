# Herald default configuration.
#
# Ships runnable-but-inert: loopback bind, auth off, log provider only.
# Fill credentials yourself — nothing is embedded. On OpenWrt this file is
# /etc/herald/config.yaml (the advanced-mode config: set
# herald.general.mode=advanced to run heraldd on it directly; it is a
# conffile, so package upgrades never overwrite it, and the LuCI settings
# page has an editor for it). The full field reference lives in the docs
# (https://cuihairu.github.io/herald, guide/configuration).

server:
  addr: "127.0.0.1:8080"

auth:
  enabled: false
  # For a LAN/public bind turn auth on and set a real key (herald refuses
  # to start auth-disabled on a non-loopback address):
  # enabled: true
  # api_keys:
  #   "your-api-key": "operator"
  store_path: "/etc/herald/store.db"

providers:
  log:
    type: log
    enabled: true
    config:
      name: "herald"
  # Do NOT add a disabled provider stanza here: herald still constructs
  # disabled providers through their factory, so an empty-token telegram
  # block would crash startup (procd respawn loop). To enable a channel,
  # add its block with enabled: true AND real credentials, e.g.
  # telegram:
  #   type: telegram
  #   enabled: true
  #   config:
  #     token: "123456:ABC..."
  #     chat_id: "123456789"

routes:
  error:
    - log
  warning:
    - log
  info:
    - log

queue:
  type: memory
  size: 10000
  timeout: 5s

retry:
  max: 3
  backoff: exponential
  initial_delay: 1s
  max_delay: 1m

dedup:
  enabled: true
  window: 5m

websocket:
  # Worker channel; keep loopback unless you also set auth_token.
  addr: "127.0.0.1:8081"
